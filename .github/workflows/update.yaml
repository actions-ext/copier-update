---
name: Update installed repositories

"on":
  repository_dispatch:
    types:
      - copier-update
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      repository:
        description: Optional owner/repository to update
        required: false
        type: string

concurrency:
  group: copier-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: vars.COPIER_APP_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # latest
        with:
          toolchain: stable

      - name: Install worker
        run: python -m pip install .

      - name: Update repositories
        run: copier-update-app
        env:
          COPIER_APP_ID: ${{ vars.COPIER_APP_ID }}
          COPIER_APP_PRIVATE_KEY: ${{ secrets.COPIER_APP_PRIVATE_KEY }}
          COPIER_OWNER: ${{ github.event.client_payload.owner }}
          COPIER_REPOSITORY: ${{ inputs.repository }}
          COPIER_REPOSITORIES: >-
            ${{ toJSON(github.event.client_payload.repositories) }}
          COPIER_SCOPE: ${{ github.event.client_payload.scope }}
