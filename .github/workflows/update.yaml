name: Update installed repositories

on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      repository:
        description: Optional owner/repository to update
        required: false
        type: string

concurrency:
  group: copier-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: vars.COPIER_APP_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # latest
        with:
          toolchain: stable

      - name: Install worker
        run: python -m pip install .

      - name: Update repositories
        run: copier-update-app
        env:
          COPIER_APP_ID: ${{ vars.COPIER_APP_ID }}
          COPIER_APP_PRIVATE_KEY: ${{ secrets.COPIER_APP_PRIVATE_KEY }}
          COPIER_REPOSITORY: ${{ inputs.repository }}
