---
name: Deploy control plane

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yaml
      - web/**
  workflow_dispatch:

concurrency:
  group: deploy-control-plane
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      vars.CLOUDFLARE_ACCOUNT_ID != '' &&
      vars.COPIER_APP_CLIENT_ID != '' &&
      vars.COPIER_APP_ID != '' &&
      vars.COPIER_UPDATE_PUBLIC_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Deploy Worker
        # v4.0.0
        # yamllint disable-line rule:line-length
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_TEMPLATES_API_TOKEN }}
          command: deploy
          secrets: |
            GITHUB_APP_PRIVATE_KEY
            GITHUB_CLIENT_SECRET
            SESSION_SECRET
          vars: |
            GITHUB_APP_ID
            GITHUB_CLIENT_ID
            PUBLIC_URL
          workingDirectory: web
          wranglerVersion: 4.118.0
        env:
          GITHUB_APP_ID: ${{ vars.COPIER_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.COPIER_APP_PRIVATE_KEY }}
          GITHUB_CLIENT_ID: ${{ vars.COPIER_APP_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.COPIER_APP_CLIENT_SECRET }}
          PUBLIC_URL: ${{ vars.COPIER_UPDATE_PUBLIC_URL }}
          SESSION_SECRET: ${{ secrets.COPIER_UPDATE_SESSION_SECRET }}
